[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aislescout"
version = "0.1.0"
description = "Find the best grocery deals across nearby stores, ranked by price per unit."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
aislescout = "aislescout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aislescout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
